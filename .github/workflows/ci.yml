name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Unit tests plus the gateway-like integration tests, which talk to the
  # server over 127.0.0.1 and ::1 (GitHub's runners have IPv6 loopback).
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # The enrollment scenarios against a real cert-manager in a dual-stack
  # kind cluster (the #[ignore]d tests); the server runs in-process.
  e2e:
    name: e2e / cert-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
      - run: scripts/e2e-cluster.sh up
      - run: cargo test --workspace --locked -- --ignored
        env:
          EST_E2E_KUBECONFIG: ${{ github.workspace }}/target/e2e/kubeconfig

  msrv:
    name: ${{ matrix.crate }} / MSRV
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [est-proto, est-server]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - name: Verify declared rust-version actually builds
        run: cargo msrv verify --path crates/${{ matrix.crate }}

  # Licenses, banned/duplicate crates and crate sources, see deny.toml.
  # Advisories are checked in audit.yml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: licenses bans sources

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-sbom
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/cargo-sbom" "https://github.com/psastras/sbom-rs/releases/download/cargo-sbom-latest/cargo-sbom-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/cargo-sbom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # `--cargo-package` takes the package name; a path silently gives an
      # SBOM without packages.
      - name: Generate SPDX SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 --cargo-package est-server > est-server.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: est-server-sbom
          path: est-server.spdx.json

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/est-server --set 'serverCertificate.dnsNames[0]=est.example.com'

  # Builds the image (not pushed) so a broken Dockerfile shows up in PRs.
  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: est-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm est-server:ci --version
