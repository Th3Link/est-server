# cargo-deny config, see https://embarkstudios.github.io/cargo-deny/
#
# CI runs `licenses`, `bans` and `sources` from here (ci.yml). Advisories
# are covered by the separate cargo-audit based "Security audit" workflow
# (audit.yml), which also files issues for new advisories on a schedule.

[graph]
all-features = true

[licenses]
# Our own license is Apache-2.0 OR MIT, so every dependency must be
# compatible with distributing under either. A new dependency with a
# license that isn't listed fails CI until it is reviewed and added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # webpki-root-certs (Mozilla's root list as data), via reqwest in the
    # integration tests only.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Several versions of a crate are normal while the ecosystem moves (base64,
# syn, getrandom, …); report them, but don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
