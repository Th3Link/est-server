[package]
name = "est-server"
version = "0.1.0"
description = "EST (RFC 7030) server for small clients, standalone or backed by cert-manager"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "tracing"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
est-proto = { path = "../est-proto" }
futures-util = "0.3.34"
hex = "0.4"
humantime = "2"
humantime-serde = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "derive", "runtime", "rustls-tls", "ring"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"

[dev-dependencies]
function_name = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tempfile = "3"
