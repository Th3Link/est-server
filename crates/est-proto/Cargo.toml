[package]
name = "est-proto"
version = "0.1.0"
description = "EST (RFC 7030) wire format: base64 bodies, PKCS#10 requests, certs-only PKCS#7 responses"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
# cms 0.2 is built on the x509-cert 0.2 / der 0.7 / const-oid 0.9 line.
cms = "0.2.3"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["oid", "alloc"] }
thiserror = "2"
x509-cert = { version = "0.2", default-features = false }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
rcgen = "0.14"
